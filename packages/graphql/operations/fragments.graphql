# Shared by the website and the dashboard.

fragment SenseCard on LexicalSense {
  id
  revisionId
  senseKey
  partOfSpeech
  definition
  cefrLevel
  usageNote
  register
  examples {
    sentence
  }
  pronunciations {
    accent
    ipa
  }
  translations {
    locale
    text
  }
  entry {
    id
    displayForm
    kind
  }
}

fragment ExerciseSetView on ExerciseSet {
  id
  title
  instructions
  questions {
    __typename
    id
    position
    points
    ... on SingleChoiceQuestion {
      stem
      options {
        id
        content
      }
    }
    ... on TrueFalseNotGivenQuestion {
      statement
    }
    ... on GapFillQuestion {
      segments {
        __typename
        ... on TextSegment {
          text
        }
        ... on GapSegment {
          gapId
        }
      }
    }
    ... on MultipleChoiceQuestion {
      stem
      choose
      options {
        id
        content
      }
    }
    ... on YesNoNotGivenQuestion {
      statement
    }
    ... on MatchingQuestion {
      matchingVariant: variant
      reuse
      items {
        itemId
        text
      }
      options {
        id
        content
      }
    }
    ... on CompletionQuestion {
      completionVariant: variant
      wordLimit
      wordBox
      segments {
        __typename
        ... on TextSegment {
          text
        }
        ... on GapSegment {
          gapId
        }
      }
    }
    ... on ShortAnswerQuestion {
      question
      wordLimit
    }
  }
}

fragment PracticeResultView on PracticeResult {
  exerciseSetId
  score
  maxScore
  questions {
    questionId
    correct
    awardedPoints
    maxPoints
    explanation
    correctAnswer {
      __typename
      ... on ChoiceAnswer {
        optionId
      }
      ... on JudgementAnswer {
        judgement
      }
      ... on GapsAnswer {
        gaps {
          gapId
          text
        }
      }
      ... on ChoicesAnswer {
        optionIds
      }
      ... on MatchesAnswer {
        matches {
          itemId
          optionId
        }
      }
      ... on TextAnswer {
        text
      }
    }
  }
}

fragment VocabularyItemView on VocabularyItem {
  isKey
  sense {
    ...SenseCard
  }
  occurrences {
    blockId
    start
    end
    text
    sentence
  }
}
