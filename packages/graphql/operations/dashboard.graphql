query Viewer {
  viewer {
    id
    email
    name
    memberships {
      role
      site {
        id
        domain
        name
      }
    }
  }
}

fragment RevisionFields on Revision {
  id
  revisionNo
  status
  title
  summary
  cefrLevel
  body
  lockVersion
  updatedAt
  submittedAt
  publishedAt
  topics {
    slug
    name
  }
}

fragment EditorialSummary on EditorialResource {
  id
  kind
  createdAt
  archivedAt
  localizations {
    id
    locale
    slug
    draft {
      id
      status
      title
      updatedAt
      lockVersion
    }
    published {
      id
      title
      revisionNo
      publishedAt
    }
  }
}

query EditorialList($siteId: ID!) {
  editorialResources(siteId: $siteId) {
    ...EditorialSummary
  }
}

query EditorialLesson($id: ID!) {
  editorialResource(id: $id) {
    id
    kind
    archivedAt
    site {
      id
      domain
      name
    }
    localizations {
      id
      locale
      slug
      draft {
        ...RevisionFields
        exercises
        vocabulary {
          ...SenseCard
        }
        vocabularyItems {
          ...VocabularyItemView
        }
        audioTracks {
          ...AudioTrackFields
        }
      }
      published {
        ...RevisionFields
      }
    }
  }
}

query EditorTopics {
  topics {
    slug
    name
  }
}

query SenseSearch($query: String!) {
  lexicalSearch(query: $query, first: 10) {
    id
    displayForm
    kind
    senses {
      ...SenseCard
    }
  }
}

mutation CreateResource($input: CreateResourceInput!) {
  createResource(input: $input) {
    ...EditorialSummary
  }
}

mutation StartDraft($localizationId: ID!) {
  startDraft(localizationId: $localizationId) {
    ...EditorialSummary
  }
}

mutation UpdateDraft($input: UpdateDraftInput!) {
  updateDraft(input: $input) {
    ...EditorialSummary
  }
}

mutation SaveExerciseSets($localizationId: ID!, $lockVersion: Int!, $sets: ExercisePayload!) {
  saveExerciseSets(localizationId: $localizationId, lockVersion: $lockVersion, sets: $sets) {
    ...EditorialSummary
  }
}

mutation SubmitForReview($localizationId: ID!, $lockVersion: Int!) {
  submitForReview(localizationId: $localizationId, lockVersion: $lockVersion) {
    ...EditorialSummary
  }
}

mutation ReturnToDraft($localizationId: ID!, $lockVersion: Int!, $note: String) {
  returnToDraft(localizationId: $localizationId, lockVersion: $lockVersion, note: $note) {
    ...EditorialSummary
  }
}

mutation PublishResource($localizationId: ID!, $lockVersion: Int!) {
  publishResource(localizationId: $localizationId, lockVersion: $lockVersion) {
    ...EditorialSummary
  }
}

mutation ArchiveResource($resourceId: ID!) {
  archiveResource(resourceId: $resourceId) {
    ...EditorialSummary
  }
}

fragment SenseRevisionFields on SenseRevision {
  id
  revisionNo
  status
  definition
  cefrLevel
  usageNote
  register
  lockVersion
  publishedAt
  examples {
    sentence
    explanation
  }
  pronunciations {
    accent
    ipa
  }
  translations {
    locale
    text
  }
}

fragment EditorialSenseFields on EditorialSense {
  id
  site {
    id
    domain
    name
  }
  senseKey
  partOfSpeech
  entry {
    id
    displayForm
    kind
  }
  draft {
    ...SenseRevisionFields
  }
  published {
    ...SenseRevisionFields
  }
}

query WordBank($siteId: ID!, $query: String) {
  editorialSenses(siteId: $siteId, query: $query, first: 200) {
    ...EditorialSenseFields
  }
}

query WordBankSense($id: ID!) {
  editorialSense(id: $id) {
    ...EditorialSenseFields
  }
}

mutation ManageSense($input: ManageLexicalSenseInput!) {
  manageLexicalSense(input: $input) {
    ...EditorialSenseFields
  }
}

mutation PublishSense($senseId: ID!, $lockVersion: Int!) {
  publishLexicalSense(senseId: $senseId, lockVersion: $lockVersion) {
    ...EditorialSenseFields
  }
}

mutation PublishNow($localizationId: ID!, $lockVersion: Int!) {
  publishNow(localizationId: $localizationId, lockVersion: $lockVersion) {
    ...EditorialSummary
  }
}

fragment AudioTrackFields on AudioTrack {
  id
  status
  voiceName
  gender
  accent
  label
  url
  durationMs
  characters
  stale
  error
  createdAt
}

query VoiceCatalog($siteId: ID!) {
  voiceCatalog(siteId: $siteId) {
    provider
    charactersUsed
    charactersLimit
    voices {
      id
      name
      gender
      accent
      previewUrl
    }
  }
}

query DraftAudio($id: ID!) {
  editorialResource(id: $id) {
    id
    localizations {
      id
      draft {
        id
        audioTracks {
          ...AudioTrackFields
        }
      }
    }
  }
}

mutation RequestVoiceovers($localizationId: ID!, $voiceIds: [ID!]!) {
  requestVoiceovers(localizationId: $localizationId, voiceIds: $voiceIds) {
    ...AudioTrackFields
  }
}

mutation ApproveAudioTrack($id: ID!) {
  approveAudioTrack(id: $id) {
    ...AudioTrackFields
  }
}

mutation DeleteAudioTrack($id: ID!) {
  deleteAudioTrack(id: $id)
}
