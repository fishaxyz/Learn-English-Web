enum ResourceKind {
  READING
  LISTENING
  LEXICAL_COLLECTION
  ARTICLE
}

enum RevisionStatus {
  DRAFT
  IN_REVIEW
  PUBLISHED
  SUPERSEDED
}

type Topic {
  id: ID!
  slug: String!
  name: String!
  description: String
}

type ExamLabel {
  id: ID!
  code: String!
  name: String!
}

"A published lesson or article, as learners see it. Always one exact, frozen revision."
interface Resource {
  id: ID!
  kind: ResourceKind!
  locale: String!
  slug: String!
  title: String!
  summary: String
  cefrLevel: CefrLevel
  body: RichText!
  revisionNo: Int!
  publishedAt: DateTime!
  topics: [Topic!]!
  examLabels: [ExamLabel!]!
  exerciseSets: [ExerciseSet!]!
}

type ReadingResource implements Resource {
  "Conversation lessons: the names shown instead of HOST1/HOST2."
  speakerNames: SpeakerNames
  id: ID!
  kind: ResourceKind!
  locale: String!
  slug: String!
  title: String!
  summary: String
  cefrLevel: CefrLevel
  body: RichText!
  revisionNo: Int!
  publishedAt: DateTime!
  topics: [Topic!]!
  examLabels: [ExamLabel!]!
  exerciseSets: [ExerciseSet!]!
  "The word senses the text links to (its `lexical` marks), at the exact revisions it pinned."
  vocabulary: [LexicalSense!]!
  "The same links as learners choose them: one item per word or structure, with key flags and sentences."
  vocabularyItems: [VocabularyItem!]!
  "Approved voice-overs, each with its voice tags and word timings."
  audioTracks: [AudioTrack!]!
  wordCount: Int!
  "At about 200 words a minute."
  estimatedReadingSeconds: Int!
}

type ListeningResource implements Resource {
  id: ID!
  kind: ResourceKind!
  locale: String!
  slug: String!
  title: String!
  summary: String
  cefrLevel: CefrLevel
  "The transcript. Audio tracks and timings arrive in Phase 3."
  body: RichText!
  revisionNo: Int!
  publishedAt: DateTime!
  topics: [Topic!]!
  examLabels: [ExamLabel!]!
  exerciseSets: [ExerciseSet!]!
}

type LexicalCollectionResource implements Resource {
  id: ID!
  kind: ResourceKind!
  locale: String!
  slug: String!
  title: String!
  summary: String
  cefrLevel: CefrLevel
  body: RichText!
  revisionNo: Int!
  publishedAt: DateTime!
  topics: [Topic!]!
  examLabels: [ExamLabel!]!
  exerciseSets: [ExerciseSet!]!
  "The words, pinned to the exact sense revisions chosen when the collection was published."
  items: [LexicalSense!]!
}

type ArticleResource implements Resource {
  id: ID!
  kind: ResourceKind!
  locale: String!
  slug: String!
  title: String!
  summary: String
  cefrLevel: CefrLevel
  body: RichText!
  revisionNo: Int!
  publishedAt: DateTime!
  topics: [Topic!]!
  examLabels: [ExamLabel!]!
  exerciseSets: [ExerciseSet!]!
}

input ResourceFilter {
  kind: ResourceKind
  cefrLevel: CefrLevel
  topicSlug: String
  "Defaults to the site's default locale."
  locale: String
  "Full-text search in titles, summaries and text."
  search: String
}

type ResourceConnection {
  nodes: [Resource!]!
  pageInfo: PageInfo!
}

extend type Query {
  "Published resources on this site, newest first. `first` is at most 50."
  publishedResources(filter: ResourceFilter, first: Int! = 20, after: String): ResourceConnection!
  resourceBySlug(kind: ResourceKind!, slug: String!, locale: String): Resource
  topics: [Topic!]!

  "Editorial: a resource with its draft and published revisions. Members of its site only."
  editorialResource(id: ID!): EditorialResource
  "Editorial: a site's resources, newest first (at most 100)."
  editorialResources(siteId: ID!, first: Int! = 50): [EditorialResource!]!
  "Editorial: whether a web address is free on the site, and the first free one like it (sasas, sasas-2...)."
  slugAvailability(siteId: ID!, slug: String!): SlugAvailability!
}

# --- Editorial

"The four parts of a reading lesson."
enum LessonPart {
  SCRIPT
  VOICEOVER
  VOCABULARY
  QUESTIONS
}

"Which parts of a lesson are finished. Review and publishing wait until none is missing."
type LessonChecklist {
  "The text isn't empty."
  script: Boolean!
  "An approved voice-over that still matches the text."
  voiceover: Boolean!
  "At least one word or phrase linked."
  vocabulary: Boolean!
  "At least one question."
  questions: Boolean!
  "Required parts that aren't finished yet."
  missing: [LessonPart!]!
}

type Revision {
  "Editorial: which parts are finished."
  checklist: LessonChecklist!
  speakerNames: SpeakerNames
  id: ID!
  revisionNo: Int!
  status: RevisionStatus!
  title: String!
  summary: String
  cefrLevel: CefrLevel
  body: RichText!
  topics: [Topic!]!
  "The linked word senses, as in the text."
  vocabulary: [LexicalSense!]!
  vocabularyItems: [VocabularyItem!]!
  "Every voice-over of this revision, in any state."
  audioTracks: [AudioTrack!]!
  "The exercises, answer keys included, in the shape saveExerciseSets takes. Editors only."
  exercises: ExercisePayload!
  "Pass this back when you change the revision; a mismatch means someone else changed it first."
  lockVersion: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  submittedAt: DateTime
  publishedAt: DateTime
}

type EditorialLocalization {
  id: ID!
  locale: String!
  slug: String!
  draft: Revision
  published: Revision
}

type EditorialResource {
  id: ID!
  kind: ResourceKind!
  site: Site!
  createdAt: DateTime!
  archivedAt: DateTime
  localizations: [EditorialLocalization!]!
}

input CreateResourceInput {
  speakerNames: SpeakerNamesInput
  siteId: ID!
  kind: ResourceKind!
  locale: String! = "en"
  slug: String!
  title: String!
  summary: String
  cefrLevel: CefrLevel
  body: RichText
  topicSlugs: [String!]
}

input UpdateDraftInput {
  "Set to replace the host names; null fields clear a name."
  speakerNames: SpeakerNamesInput
  localizationId: ID!
  lockVersion: Int!
  title: String
  summary: String
  cefrLevel: CefrLevel
  body: RichText
  "Replaces the draft's topics."
  topicSlugs: [String!]
}

extend type Mutation {
  "Editors: a new resource with its first draft."
  createResource(input: CreateResourceInput!): EditorialResource!
  "Editors: a new draft copied from the published revision (exercises included)."
  startDraft(localizationId: ID!): EditorialResource!
  updateDraft(input: UpdateDraftInput!): EditorialResource!
  "Editors: hand the draft to a reviewer."
  submitForReview(localizationId: ID!, lockVersion: Int!): EditorialResource!
  "Reviewers: send it back to the editor."
  returnToDraft(localizationId: ID!, lockVersion: Int!, note: String): EditorialResource!
  "Reviewers: publish the reviewed draft. The previous published revision is superseded, never changed."
  publishResource(localizationId: ID!, lockVersion: Int!): EditorialResource!
  "Editors: replace the draft's exercises. Validated as a whole."
  saveExerciseSets(localizationId: ID!, lockVersion: Int!, sets: ExercisePayload!): EditorialResource!
  "Admins and owners: publish a draft straight away, without the review queue. Recorded in the audit log."
  publishNow(localizationId: ID!, lockVersion: Int!): EditorialResource!
  "Admins: take the resource off the site. Its revisions are kept."
  archiveResource(resourceId: ID!): EditorialResource!
}

type SlugAvailability {
  available: Boolean!
  "A free address like the one asked for: the same one when it's free."
  suggestion: String!
}
