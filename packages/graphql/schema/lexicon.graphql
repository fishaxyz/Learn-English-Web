enum LexicalEntryKind {
  WORD
  PHRASE
  COLLOCATION
  IDIOM
  PHRASAL_VERB
  "A grammar or sentence pattern, e.g. \"If I were you, I'd + verb\". Learners add it whole."
  SENTENCE_PATTERN
}

"The meaning in another language."
type Translation {
  "BCP 47 language, e.g. vi or pt-BR."
  locale: String!
  text: String!
}

input TranslationInput {
  locale: String!
  text: String!
}

"Where a vocabulary item appears in a text: a span of one block, and the sentence around it."
type TextOccurrence {
  blockId: String!
  "Unicode code-point offsets into the block's text."
  start: Int!
  end: Int!
  text: String!
  sentence: String!
}

"""
A word or structure a text links to, as learners choose it: the exact sense revision the text pinned, whether the
editor marked it a key word, and every place it appears (a split pattern has several).
"""
type VocabularyItem {
  sense: LexicalSense!
  isKey: Boolean!
  occurrences: [TextOccurrence!]!
}

type LexicalExample {
  sentence: String!
  explanation: String
}

type Pronunciation {
  "BCP 47 accent label, e.g. en-GB or en-US."
  accent: String!
  ipa: String!
}

"One meaning of a headword, as one exact revision."
type LexicalSense {
  id: ID!
  senseKey: String!
  partOfSpeech: String!
  revisionId: ID!
  definition: String!
  cefrLevel: CefrLevel
  usageNote: String
  register: String
  examples: [LexicalExample!]!
  pronunciations: [Pronunciation!]!
  translations: [Translation!]!
  entry: LexicalEntry!
}

type LexicalEntry {
  id: ID!
  displayForm: String!
  kind: LexicalEntryKind!
  language: String!
  "Published senses only."
  senses: [LexicalSense!]!
}

extend type Query {
  "Exact and fuzzy headword lookup. Only entries with a published sense. `first` is at most 50."
  lexicalSearch(query: String!, first: Int! = 20): [LexicalEntry!]!
  lexicalEntryById(id: ID!): LexicalEntry
}

# --- Editorial

type SenseRevision {
  id: ID!
  revisionNo: Int!
  status: RevisionStatus!
  definition: String!
  cefrLevel: CefrLevel
  usageNote: String
  register: String
  lockVersion: Int!
  examples: [LexicalExample!]!
  pronunciations: [Pronunciation!]!
  translations: [Translation!]!
  publishedAt: DateTime
}

type EditorialSense {
  id: ID!
  site: Site!
  senseKey: String!
  partOfSpeech: String!
  entry: LexicalEntry!
  draft: SenseRevision
  published: SenseRevision
}

input LexicalExampleInput {
  sentence: String!
  explanation: String
}

input PronunciationInput {
  accent: String!
  ipa: String!
}

"""
Creates a sense (and its entry, given headword and kind), or edits a sense's draft. Editing a sense with no
draft starts a new draft revision; the published one is never changed.
"""
input ManageLexicalSenseInput {
  siteId: ID!
  "An existing sense to edit. Omit to create one."
  senseId: ID
  "For a new sense: its entry, or headword + kind to create one."
  entryId: ID
  headword: String
  kind: LexicalEntryKind
  partOfSpeech: String!
  senseKey: String!
  definition: String!
  cefrLevel: CefrLevel
  usageNote: String
  register: String
  examples: [LexicalExampleInput!]! = []
  pronunciations: [PronunciationInput!]! = []
  translations: [TranslationInput!]! = []
  "Required when editing an existing draft."
  lockVersion: Int
}

extend type Query {
  "Editorial: the site's word bank, drafts included, optionally filtered by headword (at most 200)."
  editorialSenses(siteId: ID!, query: String, first: Int! = 100): [EditorialSense!]!
  "Editorial: one sense with its draft and published revisions."
  editorialSense(id: ID!): EditorialSense
}

extend type Mutation {
  manageLexicalSense(input: ManageLexicalSenseInput!): EditorialSense!
  publishLexicalSense(senseId: ID!, lockVersion: Int!): EditorialSense!
}
