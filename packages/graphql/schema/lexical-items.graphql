# --- A lesson's own lexical vocabulary (ADRs 0010, 0011): the items of the editor's vocabulary sheet, as written.

enum LexicalItemKind {
  KEYWORD
  COLLOCATION
  IDIOM
  PHRASAL_VERB
  "A sentence structure or grammar pattern."
  STRUCTURE
  "A paraphrase: other words for the same idea, as IELTS questions reword the passage."
  PARAPHRASE
}

enum LexicalItemStatus {
  "Read from the sheet, waiting for an editor."
  DRAFT
  "Checked by an editor: learners see it once the lesson is published."
  APPROVED
}

"A text in one native language."
type LexicalItemTranslation {
  language: String!
  text: String!
}

type LexicalItemExample {
  text: String!
  "True when the sentence is in the lesson's script."
  inText: Boolean!
  translations: [LexicalItemTranslation!]!
}

type LexicalItemSynonym {
  text: String!
  "When to use it: register, nuance."
  note: String
  translations: [LexicalItemTranslation!]!
}

type LexicalItemNote {
  text: String!
  translation: String
}

"What one native language's sheet adds to an item."
type LexicalItemLanguage {
  language: String!
  meaning: String
  "The definition in this language."
  definition: String
  notes: [LexicalItemNote!]!
}

interface LexicalItemContent {
  id: ID!
  text: String!
  kind: LexicalItemKind!
  partOfSpeech: String
  pronunciation: String
  "The English definition (for a structure: when to use it)."
  definition: String
  usage: String
  examples: [LexicalItemExample!]!
  synonyms: [LexicalItemSynonym!]!
  "A paraphrase's other side: the question's words."
  pairedWith: String
  "The question it belongs to, as the sheet labels it (\"Q2\")."
  question: String
  languages: [LexicalItemLanguage!]!
}

type LexicalItem implements LexicalItemContent {
  id: ID!
  text: String!
  kind: LexicalItemKind!
  partOfSpeech: String
  pronunciation: String
  definition: String
  usage: String
  examples: [LexicalItemExample!]!
  synonyms: [LexicalItemSynonym!]!
  pairedWith: String
  question: String
  languages: [LexicalItemLanguage!]!
  status: LexicalItemStatus!
}

extend type Revision {
  "Editorial: the lesson's lexical vocabulary, in sheet order."
  lexicalItems: [LexicalItem!]!
}

"An approved item of a published lesson, for the learner's Lexical Vocabulary tab."
type PublicLexicalItem implements LexicalItemContent {
  id: ID!
  text: String!
  kind: LexicalItemKind!
  partOfSpeech: String
  pronunciation: String
  definition: String
  usage: String
  examples: [LexicalItemExample!]!
  synonyms: [LexicalItemSynonym!]!
  pairedWith: String
  question: String
  languages: [LexicalItemLanguage!]!
}

extend type ReadingResource {
  "Approved lexical vocabulary, in sheet order."
  lexicalItems: [PublicLexicalItem!]!
}

type LexicalSheetRead {
  "New items."
  added: Int!
  "Items already in the lesson: updated from the sheet, to be checked again."
  updated: Int!
}

input LexicalItemApproval {
  id: ID!
  kind: LexicalItemKind!
}

extend type Mutation {
  """
  Editors: read a vocabulary sheet into the lesson. `language` is the native language its meanings and translations
  are written in (vi, fr, de). Items already there are updated and go back to draft.
  """
  addLexicalSheet(localizationId: ID!, sheet: String!, language: String!): LexicalSheetRead!
  "Editors: approve items (with the kind chosen). Returns how many were approved."
  approveLexicalItems(localizationId: ID!, items: [LexicalItemApproval!]!): Int!
  "Editors: remove items from the lesson. Returns how many were removed."
  deleteLexicalItems(localizationId: ID!, ids: [ID!]!): Int!
}
