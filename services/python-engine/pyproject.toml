[project]
name = "content-engine"
version = "0.0.0"
description = "Background worker for the English skills platform: slow and specialised jobs, talking only to the GraphQL API."
requires-python = ">=3.13"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
]

[project.scripts]
content-engine-worker = "content_engine.worker:main"

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # placeholder tokens in tests

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
