# Local development: every core service, each started once the ones it needs are healthy.
# Run from the repository root:  pnpm docker:up   (reads ./.env; copy .env.example first)
# Ports listen on 127.0.0.1 only, so nothing is exposed to the local network.
name: english-skills

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies database migrations once, then exits; the API starts only if it succeeded (AGENTS.md §12).
  migrate:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_PORT: "4400"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_JSON: "1"
      DEFAULT_SITE_DOMAIN: ${DEFAULT_SITE_DOMAIN:-localhost}
      # Requests reach the API through the website's server, which passes the visitor's address on.
      TRUST_PROXY: "true"
      REVALIDATION_URLS: http://website:3400/api/revalidate
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:?set REVALIDATION_SECRET in .env}
    ports:
      - "127.0.0.1:4400:4400"
    depends_on:
      migrate:
        condition: service_completed_successfully

  website:
    build:
      context: ..
      dockerfile: infrastructure/docker/next.Dockerfile
      args:
        APP: website
    environment:
      GRAPHQL_API_URL: http://api:4400
      PORT: "3400"
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      SITE_URL: ${SITE_URL:-http://localhost:3400}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:?set REVALIDATION_SECRET in .env}
    ports:
      - "127.0.0.1:3400:3400"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: infrastructure/docker/next.Dockerfile
      args:
        APP: dashboard
    environment:
      GRAPHQL_API_URL: http://api:4400
      PORT: "3401"
    ports:
      - "127.0.0.1:3401:3401"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ../services/python-engine
    environment:
      GRAPHQL_API_URL: http://api:4400
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-10}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
