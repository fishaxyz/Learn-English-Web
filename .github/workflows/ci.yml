# Every push and pull request: lint, type checks, tests and builds must pass before a merge (AGENTS.md §11).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    # Integration tests run against real PostgreSQL (AGENTS.md §11), in throwaway databases.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci-only-password@localhost:5432/ci
      REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated GraphQL types are up to date
        run: pnpm codegen && git diff --exit-code
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Schema and migrations agree
        run: pnpm --filter @english/database db:check && (cd packages/database && npx drizzle-kit generate --name=ci-drift-check | grep -q "No schema changes")
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/python-engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest

  # Phase 0's acceptance test: a clean checkout starts every service and every health check passes.
  docker:
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Start every service and wait until all are healthy
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env up --build --wait --wait-timeout 300
      - name: Load the sample content
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env run --rm -e NODE_ENV=development api node dist/seed.js
      - name: Check the health endpoints and a real query
        run: |
          curl -fsS -X POST http://127.0.0.1:4400/graphql -H 'content-type: application/json' \
            -d '{"query":"{ publishedResources(first: 5) { nodes { slug } } }"}' | grep -q a-morning-commute
          curl -fsS http://127.0.0.1:4400/health/ready
          curl -fsS http://127.0.0.1:3400/api/health/ready
          curl -fsS http://127.0.0.1:3401/api/health/ready
          docker compose -f infrastructure/docker-compose.yml --env-file .env ps
      - name: Logs, if anything failed
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env logs --no-color
      - if: always()
        run: docker compose -f infrastructure/docker-compose.yml --env-file .env down -v
